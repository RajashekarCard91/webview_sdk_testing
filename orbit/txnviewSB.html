<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>card91</title>
    <style>
      iframe {
        height: 1200px;
        width: 100%;
      }
    </style>
  </head>

  <body style="background-color: #f4f4f4">
    <script>
      window.addEventListener(
        "message",
        (e) => {
          // console.log("e,", e);
          if (e.data.type === "C91_TXN_SCREEN_INITIALISED") {
            txnPage();
          }
        },
        false
      );
      function txnPage() {
        try {
          var ORIGIN = "http://localhost:3000";
          var params = {
            payload: {
              cardId: "251202114156783ID1CARD3618207",
              token: "C91IP_up5OO2Pqc38Isb96Xek6VXFbFQ7v9aoGnF7xCF/3HS0=",
              cardHolderName: "qwoto jackson",
              customerId: "251202114137477ID1CUSTID0612255",
              phoneNumber: "919504867548",
              last4digits: "7171",
              organization: "Fashion Fiesta",
              supportMailId: "support@gmail.com",
            },
            type: "C91_TXN_SET_PARAMS",
          };
          document
            .getElementById("txnPage")
            .contentWindow.postMessage(JSON.stringify(params), ORIGIN);
        } catch (error) {
          console.log(error);
        }
      }
    </script>
    <iframe
      src="http://localhost:3000/transactions?templateId=xoltt&platform=ios&mode="
      frameborder="0"
      allow="midi"
      id="txnPage"
    ></iframe>
  </body>
</html>
