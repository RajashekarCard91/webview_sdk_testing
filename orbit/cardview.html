<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>card91</title>
    <style>
      /* .container {
        border: 1px solid red;
      } */
      iframe {
        height: 600px;
      }
    </style>
  </head>
  <body>
    <script>
      window.addEventListener(
        "message",
        (e) => {
          console.log("e,", e);
          if (e.data.type === "C91_CARD_VIEWER_INITIALISED") {
            cardView();
          }
        },
        false
      );
      function cardView() {
        try {
          var ORIGIN = "http://localhost:3000";
          var params = {
            payload: {
              cardHolderName: "wqqweqwe",
              cardId: "251215073832454ID1CARD3145999",
              customerId: "251119062818642ID1CUSTID8900050",
              last4digits: "6362",
              token: "C91IP_BiwtpXGAqqXhv5dCQyeXJxOGQq55D48QFNMGBOLGqTU=",
            },
            type: "C91_CARD_SET_PARAMS",
          };
          document
            .getElementById("cardView")
            .contentWindow.postMessage(JSON.stringify(params), ORIGIN);
        } catch (error) {
          console.log(error);
        }
      }
    </script>
    <iframe
      src="http://localhost:3000/view-card?templateId=orbit&platform=ios"
      frameborder="0"
      id="cardView"
    ></iframe>
  </body>
</html>
