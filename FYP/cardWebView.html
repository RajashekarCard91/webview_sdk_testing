<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>card91</title>
    <style>
      .container {
        position: relative;
        /* background: url("../../test-card-cmpy.png") no-repeat; */
        background-size: 341px 200px;
        height: 200px;
        width: 341px;
        /* border: 1px solid red; */
        background-color: green;
      }
      .bg-default {
        background: url("../../fyp_test_image.png") no-repeat;
        /* background: url("../../fyp_design.png") no-repeat; */
        background-size: 341px 200px;
      }
      .bg-default1 {
        background: url("../../fyp_design.png") no-repeat;
        background-size: 341px 200px;
      }
      .bg-toggled {
        background: url("../../no-chip.png") no-repeat;
        background-size: 341px 200px;
      }

      .cardWrapper {
        height: 200px;
        width: 341px;
        background: transparent;
      }

      iframe {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container bg-default">
      <div class="cardWrapper">
        <script>
          window.addEventListener(
            "message",
            (e) => {
              if (e.data.type === "C91_CARD_VIEWER_INITIALISED") {
                cardView();
              }
              // ...inside <script>...
              if (e.data.type === "CARD_TOGGLE_ON") {
                console.log("Card_Toggled_On event received");
                const container = document.querySelector(".container");
                container.classList.remove("bg-default");
                container.classList.add("bg-toggled");
              }
              if (e.data.type === "CARD_TOGGLE_OFF") {
                const container = document.querySelector(".container");
                container.classList.remove("bg-toggled");
                container.classList.add("bg-default");
              }
              // ...existing code...
            },
            false
          );
          function cardView() {
            try {
              var ORIGIN = "http://localhost:3000";
              var params = {
                payload: {
                  cardHolderName: "John Doe",
                  cardId: "250603052653707ID1CARD6134452",
                  customerId: "250416062218388ID1CUSTID9625472",
                  last4digits: "8534",
                  token: "C91IP_eBCM5BaDGEhumks8n0qkb7sK0d6b0FUg7CfjKJTcT2c=",
                },
                type: "C91_CARD_SET_PARAMS",
              };
              document
                .getElementById("cardView")
                .contentWindow.postMessage(JSON.stringify(params), ORIGIN);
            } catch (error) {
              console.log(error);
            }
          }
        </script>
        <iframe
          src="http://localhost:3000/view-card?templateId=FYP&platform=ios"
          frameborder="0"
          id="cardView"
        ></iframe>
      </div>
    </div>
    <div class="container bg-default1"></div>
  </body>
</html>
